# ---------------------------------------------------------------------------
# OIDC Client Registry for EUDIStack local development (Atlassian-style)
#
# One client per tenant. Client ID pattern: vc-auth-client-{tenant}
# URLs follow Atlassian-style: {tenant}.127.0.0.1.nip.io:4443/issuer/
# ---------------------------------------------------------------------------

clients:
  # ── Platform (sysAdmin) ──
  - clientId: "vc-auth-client-platform"
    url: "https://platform.127.0.0.1.nip.io:4443/issuer"
    tenant: "platform"
    clientAuthenticationMethods:
      - "none"
    authorizationGrantTypes:
      - "authorization_code"
    redirectUris:
      - "https://platform.127.0.0.1.nip.io:4443/issuer/"
      - "https://platform.127.0.0.1.nip.io:4443/cert"
    postLogoutRedirectUris:
      - "https://platform.127.0.0.1.nip.io:4443/issuer/"
    scopes:
      - "openid"
      - "profile"
      - "email"
      - "offline_access"
      - "learcredential"
      - "role"
    requireAuthorizationConsent: false
    requireProofKey: true

  # ── Sandbox (testing) ──
  - clientId: "vc-auth-client-sandbox"
    url: "https://sandbox.127.0.0.1.nip.io:4443/issuer"
    tenant: "sandbox"
    clientAuthenticationMethods:
      - "none"
    authorizationGrantTypes:
      - "authorization_code"
    redirectUris:
      - "https://sandbox.127.0.0.1.nip.io:4443/issuer/"
      - "https://custom.127.0.0.1.nip.io:4443/issuer/"
      - "https://sandbox.127.0.0.1.nip.io:4443/cert"
    postLogoutRedirectUris:
      - "https://sandbox.127.0.0.1.nip.io:4443/issuer/"
      - "https://custom.127.0.0.1.nip.io:4443/issuer/"
    scopes:
      - "openid"
      - "profile"
      - "email"
      - "offline_access"
      - "learcredential"
      - "role"
    requireAuthorizationConsent: false
    requireProofKey: true
    clientMetadata:
      vpFormatsSupported:
        "dc+sd-jwt":
          sdJwtAlgValues: [ "ES256" ]
          kbJwtAlgValues: [ "ES256" ]
        "jwt_vc_json":
          algValuesSupported: [ "ES256" ]
      clientName: "EUDIStack"
      logoUri: "/assets/tenants/sandbox/logo.svg"
      logoDarkUri: "/assets/tenants/sandbox/logo-dark.svg"
      clientUri: "https://docs.eudistack.net/"
      localizedClaims:
        clientUri#en: "https://docs.eudistack.net/en/"


