  # ── CGCOM (client) ──
  - clientId: "vc-auth-client-cgcom"
    url: "https://cgcom.127.0.0.1.nip.io:4443/issuer"
    tenant: "cgcom"
    clientAuthenticationMethods:
      - "none"
    authorizationGrantTypes:
      - "authorization_code"
    redirectUris:
      - "https://cgcom.127.0.0.1.nip.io:4443/issuer/"
      - "https://cgcom.127.0.0.1.nip.io:4443/issuance-portal/"
      # DoctorID: la pantalla de autenticación se movió de cert-identifier
      # (redirect_uri antiguo: /cert) a issuance-portal (ruta 'identify').
      - "https://cgcom.127.0.0.1.nip.io:4443/issuance-portal/identify"
      # DoctorID: login desde eudistack-demo-client-portal (landing "Iniciar Sesión").
      - "https://cgcom.127.0.0.1.nip.io:4443/demo/corp-portal/home"
      - "https://cgcom.127.0.0.1.nip.io:4443/cert"
      - "https://cgcom.127.0.0.1.nip.io:4443/demo/rp-portal/login"
      - "http://localhost:3001/"
    postLogoutRedirectUris:
      - "https://cgcom.127.0.0.1.nip.io:4443/issuer/"
      - "https://cgcom.127.0.0.1.nip.io:4443/issuance-portal/"
    scopes:
      - "openid"
      - "profile"
      - "email"
      - "offline_access"
      - "learcredential"
      - "role"
      - "doctorid"
    requireAuthorizationConsent: false
    requireProofKey: true
    clientMetadata:
