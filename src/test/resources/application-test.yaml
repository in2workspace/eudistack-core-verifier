verifier:
  frontend:
    portalUrl: http://localhost:4200
  # US-06 [B3]: SafeUrlValidator ahora también valida backchannel_logout_uri (SSRF, SEC-14).
  # Los ITs de Single Logout despliegan sus callees de prueba en servidores HTTP locales
  # (http://localhost:<port>), que SafeUrlValidator rechazaría por defecto como loopback.
  # allow-private=true SOLO aplica al perfil de test; ninguna IT ejercita el rechazo SSRF
  # real vía el Spring context (esa cobertura vive en SafeUrlValidatorTest, unit puro).
  ssrf:
    allow-private: true
  backend:
    url: https://raw.githubusercontent.com
    identity:
      didKey: did:key:zDnaeTest
      privateKey: "0x73e509a7681d4a395b1ced75681c4dc4020dbab02da868512276dd766733d5b5"
    login-timeout-seconds: 120
    fapi-nonce-required: true
    trustFrameworks:
      - name: DOME
        trustedIssuersListUrl: https://raw.githubusercontent.com
        trustedServicesListUrl: https://raw.githubusercontent.com/in2workspace/in2-dome-gitops/refs/heads/main/trust-framework/trusted_services_list.yaml
