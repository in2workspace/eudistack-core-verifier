# Default SSO tenant configuration (classpath fallback / template).
# Real deployments OVERRIDE this by mounting a sso-config.yaml at the path given by
# VERIFIER_BACKEND_LOCALFILES_SSOCONFIGPATH (e.g. /etc/eudistack/verifier/sso-config.yaml).
#
# Fields per tenant:
#   tenant          - tenant id (lowercased on load)
#   rootDomain      - domain the SSO session cookie is scoped to. REQUIRED when
#                     ssoEnabled=true (blank + enabled -> SSO fails closed and logs
#                     event=sso_config_inconsistent). Scope it to the shared parent
#                     domain across the tenant's applications to enable SSO reuse.
#   ssoEnabled      - whether SSO session reuse is active for the tenant
#   eligibleClients - client_ids eligible for SSO reuse (empty = fail-closed, no client can reuse the session)
#   ttlAbsolute     - (optional) ISO-8601 duration for the absolute session TTL.
#                     Valid range: PT1H–PT24H. Absent or malformed → PT8H (system default).
#                     Example: "PT4H"
#   ttlIdle         - (optional) ISO-8601 duration for the idle session TTL.
#                     Valid range: PT5M–PT1H; must not exceed ttlAbsolute.
#                     Absent or malformed → PT30M (system default).
#                     Example: "PT15M"
tenants:
  - tenant: "sandbox"
    rootDomain: "sandbox.stg.eudistack.net"
    ssoEnabled: false
    eligibleClients:
      - "vc-auth-client-sandbox"

  - tenant: "cgcom"
    rootDomain: "cgcom.stg.eudistack.net"
    ssoEnabled: false
    eligibleClients:
      - "vc-auth-client-cgcom"

  - tenant: "kpmg"
    rootDomain: "kpmg.stg.eudistack.net"
    ssoEnabled: false
    eligibleClients:
      - "vc-auth-client-kpmg"

  - tenant: "dome"
    rootDomain: "dome-marketplace-lcl.org"
    ssoEnabled: true
    eligibleClients:
      - "vc-auth-client-dome"
      - "vc-auth-client-dome-custom"

  - tenant: "platform"
    rootDomain: "platform.stg.eudistack.net"
    ssoEnabled: false
    eligibleClients:
      - "vc-auth-client-platform"