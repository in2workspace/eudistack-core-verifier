# Default SSO tenant configuration (classpath fallback / template).
# Real deployments OVERRIDE this by mounting a sso-config.yaml at the path given by
# VERIFIER_BACKEND_LOCALFILES_SSOCONFIGPATH (e.g. /etc/eudistack/verifier/sso-config.yaml).
#
# Fields per tenant:
#   tenant          - tenant id (lowercased on load)
#   rootDomain      - domain the SSO session cookie is scoped to. REQUIRED when
#                     ssoEnabled=true (blank + enabled -> SSO fails closed and logs
#                     event=sso_config_inconsistent). Scope it to the shared parent
#                     domain across the tenant's applications to enable SSO reuse.
#   ssoEnabled      - whether SSO session reuse is active for the tenant
#   eligibleClients - apps eligible for SSO reuse (empty = fail-closed, no client can reuse
#                     the session). US-06 (AD-4/DELTA-01): each entry is an object
#                     { clientId, backchannelLogoutUri } — backchannelLogoutUri is optional;
#                     when absent, the primary source (ClientSettings on the RegisteredClient)
#                     is tried first, then this fallback. If neither declares a URI, the app
#                     is skipped from Back-Channel Logout dispatch (backchannel_skipped, AC-04).
#   ttlAbsolute     - (optional) ISO-8601 duration for the absolute session TTL.
#                     Valid range: PT1H–PT24H. Absent or malformed → PT8H (system default).
#                     Example: "PT4H"
#   ttlIdle         - (optional) ISO-8601 duration for the idle session TTL.
#                     Valid range: PT5M–PT1H; must not exceed ttlAbsolute.
#                     Absent or malformed → PT30M (system default).
#                     Example: "PT15M"
tenants:
  - tenant: "sandbox"
    rootDomain: "sandbox.example.com"
    ssoEnabled: false
    eligibleClients:
      - clientId: "vc-auth-client-sandbox"

  - tenant: "cgcom"
    rootDomain: "cgcom.example.com"
    ssoEnabled: false
    eligibleClients:
      - clientId: "vc-auth-client-cgcom"

  - tenant: "kpmg"
    rootDomain: "kpmg.example.com"
    ssoEnabled: false
    eligibleClients:
      - clientId: "vc-auth-client-kpmg"

  - tenant: "dome"
    rootDomain: "dome.example.com"
    ssoEnabled: true
    eligibleClients:
      - clientId: "vc-auth-client-dome"
        backchannelLogoutUri: "https://app.dome.example.com/backchannel-logout"
      - clientId: "vc-auth-client-dome-custom"
        backchannelLogoutUri: "https://custom.dome.example.com/backchannel-logout"

  - tenant: "platform"
    rootDomain: "platform.example.com"
    ssoEnabled: false
    eligibleClients:
      - clientId: "vc-auth-client-platform"
