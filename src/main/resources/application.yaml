spring:
  application:
    name: ${OTEL_SERVICE_NAME:eudistack-core-verifier}
  config:
    import: optional:file:${VERIFIER_BACKEND_LOCALFILES_DCQLPATH:}
  # Virtual Threads: enables lightweight threads for I/O-bound operations (SSE, HTTP calls)
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/verifier}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    # Enabled: Spring Boot's auto-configured flywayInitializer handles `public`
    # schema migrations. TenantSchemaFlywayMigrator runs migrations for all
    # tenant schemas separately using R2DBC credentials.
    enabled: true
    validate-migration-naming: true
    url: ${SPRING_FLYWAY_URL:jdbc:postgresql://localhost:5432/verifier}
    locations: classpath:db/tenant
    default-schema: ${SPRING_FLYWAY_DEFAULT_SCHEMA:public}
    baseline-on-migrate: true
    baseline-version: "0"

# SEC-F8: Swagger UI disabled by default. Enable via env var in dev only.
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

server:
  port: 8082
  forward-headers-strategy: framework
  servlet:
    context-path: ${APP_CONTEXT_PATH:/verifier}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{tenantDomain:-}]"
  level:
    es.in2.vcverifier: INFO
    org.springframework.security: INFO
    io.micrometer.registry.otlp: DEBUG
    io.opentelemetry.exporter: DEBUG

management.tracing:
  # Local dev → true (Spring exports to Jaeger); AWS → false (ADOT agent handles X-Ray)
  enabled: ${MANAGEMENT_TRACING_ENABLED:true}
  sampling:
    probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}
  propagation:
    type: w3c

management.otlp:
  tracing:
    # Primary export: HTTP → Jaeger (unchanged). A second, gRPC → OTel Collector → Zipkin
    # export is added independently via OtlpGrpcTracingConfig (dual export, opt-in).
    endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    grpc:
      enabled: ${MANAGEMENT_OTLP_GRPC_TRACING_ENABLED:false}
      endpoint: ${OTEL_COLLECTOR_GRPC_URL:http://127.0.0.1:4317}
  metrics:
    export:
      enabled: ${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:false}
      url: ${OTEL_COLLECTOR_GRPC_URL:http://127.0.0.1:4317}
      step: 5s
      resource-attributes:
        service.name: ${spring.application.name}

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health, prometheus
      base-path: /
      path-mapping:
        health: health
        prometheus: prometheus
  endpoint:
    health:
      access: unrestricted
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:when-authorized}
      probes:
        enabled: true
    prometheus:
      access: unrestricted
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    enable:
      all: true
      spring.security.filterchains: false   # elimina las ~40 métricas por filtro
      jvm.buffer: false
      jvm.classes: false
      jvm.compilation: false
      jvm.gc.memory.promoted: false
      jvm.gc.memory.allocated: false
      jvm.gc.max.data.size: false
      jvm.gc.live.data.size: false
      jvm.gc.overhead: false
      tasks.scheduled.execution.active: false
    distribution:
      percentiles-histogram:
        dome_verifier_dispatcher_duration_ms: true
      percentiles:
        http.server.requests: [0.5, 0.95, 0.99]
      minimum-expected-value:
        http.server.requests: 10ms
      maximum-expected-value:
        http.server.requests: 5s

# ──────────────────────────────────────────────────────────
# Verifier configuration
#
# All values below are dev defaults. Override via env vars
# in production. Spring relaxed binding applies, e.g.:
#   verifier.backend.url -> VERIFIER_BACKEND_URL
# ──────────────────────────────────────────────────────────
verifier:
  frontend:
    portalUrl: http://localhost:4200
  backend:
    # Canonical public URL of the verifier. Used as `iss`/audience in issued tokens and as
    # the base for OID4VP endpoints.
    url: http://localhost:8082
    identity:
      # Leave empty to auto-generate ephemeral P-256 key + did:key at startup (dev only).
      # For production, configure privateKey + certificate for x509_hash client_id_scheme.
      didKey:
      privateKey:
      certificate:  # Path to X.509 PEM certificate. When set, enables x509_hash client_id_scheme.
    login-timeout-seconds: ${VERIFIER_OAUTH2_LOGIN_TIMEOUT_SECONDS:120}
    fapi-nonce-required: ${VERIFIER_OAUTH2_FAPI_NONCE_REQUIRED:true}
    token-expiration:
      access-token-seconds: ${VERIFIER_ACCESS_TOKEN_EXPIRATION:900}
      id-token-seconds: ${VERIFIER_ID_TOKEN_EXPIRATION:60}
      refresh-token-seconds: ${VERIFIER_REFRESH_TOKEN_EXPIRATION:43200}
    x5c-chain-validation:
      # Secure-by-default: self-contained PKIX chain validation is ALWAYS active.
      # Set bypass=true ONLY as an operational escape hatch to restore legacy leaf-only behaviour.
      # EUDISTACK-81 AC-04 — Q2 scope (no trust store / LOTL; Q3 roadmap).
      bypass: ${VERIFIER_BACKEND_X5CCHAINVALIDATION_BYPASS:false}
      aia-chasing:
        # Enabled by default: fetches missing intermediate/root CA certs from the AIA
        # caIssuers URL in the leaf certificate. Required for QTSP-signed credentials
        # (e.g. Vintegris) that only include the leaf in x5c. Set to false in air-gapped
        # environments or when all issuers supply the full chain in x5c.
        enabled: ${VERIFIER_BACKEND_X5C_AIA_CHASING_ENABLED:true}
    trustFrameworks:
      - name: DOME
        # Leave URLs unset to use local providers (classpath YAML files)
        # trustedIssuersListUrl: https://example.org/trusted-issuers
        # trustedServicesListUrl: https://example.org/trusted-services

    local-files:
      sso-config-path: ${VERIFIER_BACKEND_SSO_CONFIG_PATH:}

  dome:
    legacy-read-enabled: ${VERIFIER_DOME_LEGACY_READ_ENABLED:true}
    bumped-read-enabled: ${VERIFIER_DOME_BUMPED_READ_ENABLED:true}

  dispatch:
    rules:
      legacy:
        - credential-configuration-id: learcredential.employee.w3c.2
          format: LEGACY_V1_1
        - credential-configuration-id: learcredential.employee.w3c.3
          format: LEGACY_V1_1
        - credential-configuration-id: learcredential.machine.w3c.2
          format: LEGACY_V1_1
        - credential-configuration-id: LEARCredentialEmployee
          format: LEGACY_V1_1
        - credential-configuration-id: LEARCredentialMachine
          format: LEGACY_V1_1
        - credential-configuration-id: gx.labelcredential.w3c.1
          format: LEGACY_V1_1
      bumped:
        - credential-configuration-id: learcredential.employee.w3c.4
          format: BUMPED_V2_0
        - credential-configuration-id: learcredential.machine.w3c.3
          format: BUMPED_V2_0
        - credential-configuration-id: gx.labelcredential.w3c.2
          format: BUMPED_V2_0
        - credential-configuration-id: learcredential.employee.sd.1
          format: BUMPED_V2_0
        - credential-configuration-id: learcredential.machine.sd.1
          format: BUMPED_V2_0
        - credential-configuration-id: urn:es.cgcom:doctorid:1
          format: BUMPED_V2_0

  # DCQL profiles are loaded from the external file specified by
  # VERIFIER_BACKEND_LOCALFILES_DCQLPATH (via spring.config.import).
  # No inline defaults — the external file is the single source of truth.
